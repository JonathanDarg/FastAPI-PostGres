services:
  db:
    image: postgres:16
    container_name: postgres_test_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: fastapi_test_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: mydatabase
      DB_USER: admin
      DB_PASSWORD: password
      DB_PORT: "5432"
    restart: unless-stopped

volumes:
  postgres_data:
